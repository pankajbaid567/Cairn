# OpenTelemetry Collector (contrib) for the obs profile (design §9, PD-11).
#
#   api, worker --OTLP/HTTP :4318--> receiver otlp
#     traces pipeline        -> debug exporter  (spans readable in `docker compose logs otel-collector`)
#                            -> spanmetrics connector
#     metrics/spanmetrics    -> prometheus exporter :8889 (Prometheus scrapes it)
#
# There is no trace store in Phase 0: a span is logged once and turned into RED metrics
# (traces_span_metrics_calls_total, traces_span_metrics_duration_milliseconds_*). A trace
# UI is deferred.
#
# Only OTLP over HTTP is enabled; the apps use the HTTP exporter. Every endpoint binds
# inside the container's network; compose publishes 4318 on 127.0.0.1 only.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # The container limit is 256m (docker-compose.yml). The limiter starts refusing data
  # well below it, so a burst is dropped instead of the container being killed.
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  batch:
    timeout: 5s
    send_batch_size: 512

connectors:
  spanmetrics:
    # Flush every 15 s (the default is 60 s) so a fresh span shows up in the next scrape.
    metrics_flush_interval: 15s
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s]

exporters:
  debug:
    verbosity: detailed
    # Per-second sampling: log the first 50 spans each second, then every 20th. The api
    # healthcheck alone produces three spans every 10 s, so this never hides anything
    # in normal use and still bounds a burst.
    sampling_initial: 50
    sampling_thereafter: 20
  prometheus:
    endpoint: 0.0.0.0:8889
    # A series that stops arriving (a stopped service) leaves the scrape after 5 minutes.
    metric_expiration: 5m

extensions:
  # The compose healthcheck calls this from inside the container (127.0.0.1 only).
  health_check:
    endpoint: 127.0.0.1:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, spanmetrics]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: info

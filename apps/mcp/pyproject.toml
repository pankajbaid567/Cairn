[project]
name = "cairn-mcp"
version = "0.1.0"
description = "Cairn MCP server (stdio, read-only). Read-only tools over the Cairn API."
requires-python = "==3.12.*"
dependencies = [
    "cairn-core",
    "httpx==0.28.1",
]

[project.scripts]
cairn-mcp = "cairn_mcp:main"

[tool.uv.sources]
cairn-core = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_mcp"]

# nginx for the Cairn web container (design §3 and §4, PD-08).
#
# This replaces /etc/nginx/nginx.conf of nginxinc/nginx-unprivileged. The container
# runs as uid 101 with a read-only root filesystem, so everything nginx writes (pid
# file, temp files for large request or response bodies) lives under /tmp, which
# compose mounts as tmpfs. Logs go to the container's stdout and stderr.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1m;

    # Docker's embedded DNS. The api name is resolved per request (see the /api/
    # location), so recreating the api container does not leave nginx pointing at
    # its old address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # API proxy: /api/readyz is sent to http://api:8000/readyz (prefix stripped).
        # There is no try_files here: every /api/ path is answered by the API, so its
        # 404 stays a 404 and never turns into the HTML page with status 200 (the
        # readiness widget reads the status code).
        location /api/ {
            set $api_upstream http://api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        # "/api" without the slash is not a page either.
        location = /api {
            return 404;
        }

        # Vite writes content-hashed file names under /assets/.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }

        # The entry page changes with every build.
        location = /index.html {
            expires -1;
        }

        # Single-page app: unknown paths get the entry page.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

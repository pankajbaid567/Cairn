[project]
name = "cairn-combined"
version = "0.1.0"
description = "Cairn combined process: the API and the DBOS jobs in one service (free-tier hosting)."
requires-python = "==3.12.*"
dependencies = [
    "cairn-api",
    "cairn-worker",
    "cairn-core",
    "cairn-retrieval",
    "cairn-connectors",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[project.scripts]
cairn-combined = "cairn_combined.__main__:main"

[tool.uv.sources]
cairn-api = { workspace = true }
cairn-worker = { workspace = true }
cairn-core = { workspace = true }
cairn-retrieval = { workspace = true }
cairn-connectors = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_combined"]

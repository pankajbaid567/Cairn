[project]
name = "cairn-api"
version = "0.1.0"
description = "Cairn HTTP API (FastAPI): liveness and readiness in Phase 0."
requires-python = "==3.12.*"
dependencies = [
    "cairn-core",
    "click==8.5.0",
    "cairn-retrieval",
    "fastapi==0.162.0",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "uvicorn==0.54.0",
]

[project.scripts]
cairn-api = "cairn_api.__main__:main"
cairn-agent = "cairn_api.agent_cli:main"
[tool.uv.sources]
cairn-core = { workspace = true }
cairn-retrieval = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_api"]

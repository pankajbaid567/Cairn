[project]
name = "cairn-core"
version = "0.1.0"
description = "Cairn core: configuration, database bootstrap, migrations, health checks and telemetry."
requires-python = "==3.12.*"
dependencies = [
    "click==8.5.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-psycopg==0.66b1",
    "opentelemetry-sdk==1.45.1",
    "psycopg[binary,pool]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
]

[project.scripts]
cairn-db = "cairn_core.cli:main"
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_core"]

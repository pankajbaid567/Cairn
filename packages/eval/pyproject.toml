[project]
name = "cairn-eval"
version = "0.1.0"
description = "Cairn evaluation: Kestrel Pay scenario tooling, canaries and the S1 and S2 spike harnesses."
requires-python = "==3.12.*"
dependencies = [
    "cairn-core",
    "cairn-connectors",
    "cairn-retrieval",
    "click==8.5.0",
    "jsonpatch==1.38",
    "jsonschema==4.26.0",
    "numpy==2.5.4",
    "pgvector==0.5.1",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "duckdb==2.0.0",
]

[project.scripts]
cairn-eval = "cairn_eval.cli:main"
cairn-scenario = "cairn_eval.scenario.cli:main"
cairn-s1 = "cairn_eval.spikes.s1_acl_corpus.cli:main"
cairn-s2 = "cairn_eval.spikes.s2_rls_explain.cli:main"
cairn-s3 = "cairn_eval.spikes.s3_models.cli:main"
[tool.uv.sources]
cairn-core = { workspace = true }
cairn-connectors = { workspace = true }
cairn-retrieval = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_eval"]

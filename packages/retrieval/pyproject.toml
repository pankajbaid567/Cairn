[project]
name = "cairn-retrieval"
version = "0.1.0"
description = "Cairn retrieval: lexical, dense and fused search under ACLs (Phase 1)."
requires-python = "==3.12.*"
dependencies = [
    "cairn-core",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "boto3==1.44.6",
]

[tool.uv.sources]
cairn-core = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_retrieval"]

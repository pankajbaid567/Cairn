  - id: ADR-008
    title: Structured JSON logging with trace ids in every service
    question: How do we correlate logs across services?
    outcome: Every service logs one JSON object per line and includes the trace id.
    decision_makers: [tomas]
    approvers: [nadia]
    anchors: {repos: [platform-infra], prs: ["platform-infra#88"]}
    timeline:
      - {event: proposed, on: 2026-03-16, source: adr-file-008}
      - {event: accepted, on: 2026-03-20, source: adr-file-008}
      - {event: implemented, on: 2026-04-10, source: pr-platform-infra-88}

  - id: ADR-009
    title: PgBouncer transaction pooling
    question: How do we cap open database connections?
    outcome: Run PgBouncer in transaction pooling mode in front of PostgreSQL.
    decision_makers: [nadia]
    approvers: [dev]
    anchors: {repos: [platform-infra, payment-service], prs: ["platform-infra#214", "payment-service#251"]}
    timeline:

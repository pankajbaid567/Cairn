      - {event: partially_reverted, on: 2026-05-20, source: pr-payment-service-251, note: The settlement job connects in session mode.}
    claims:
      - {id: C1, text: Transaction pooling cuts the number of open connections., tier: T3, support_sets: [[adr-file-009]]}
      - {id: C2, text: The settlement job has used session mode since 20 May., tier: T1, support_sets: [[pr-payment-service-251]]}

  - id: ADR-010
    title: Expose a GraphQL gateway for the public API
    question: Should mobile clients get a GraphQL gateway?
    outcome: Rejected. Keep the REST API and paginate responses.
    options:
      - {name: Add a GraphQL gateway, verdict: rejected}
      - {name: Keep REST and add pagination, verdict: chosen}
    decision_makers: [dev]
    timeline:
      - {event: proposed, on: 2026-04-15, source: adr-file-010}
      - {event: rejected, on: 2026-04-29, source: thread-arch-review-2026-04-29}
    claims:
      - {id: C1, text: A second schema to maintain outweighed the benefit for a small API., tier: T5, support_sets: [[thread-arch-review-2026-04-29]]}

  - id: ADR-011
    title: Idempotency keys on all payment write APIs
    question: How do we make client retries safe for payment writes?
    outcome: Every payment write API requires an idempotency key.
    decision_makers: [suki]
    approvers: [dev]
    anchors: {repos: [payment-service, kestrel-sdk], prs: ["payment-service#231"]}
    timeline:
      - {event: proposed, on: 2026-04-14, source: doc-sdk-idempotency}

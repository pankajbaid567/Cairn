# Kestrel Pay scenario v1 (design section 11, brainstorm section 17 and Appendix B).
# Every person, team, repo, partner and message is fictional (D20). Display names are first
# names only. Every URL uses a reserved .example host. Token canaries are written as
# {{canary:ID}} placeholders and are never typed out; the renderers substitute them.
# Validate with: make scenario-validate
schema_version: 1

